name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Testes sem rede: o Electrum é falso (test/fake-electrum.mjs).
      # test/cdp-ui.mjs e test/dev-server.mjs são utilitários e não entram aqui.
      - run: npm test

      # Valida wrangler.jsonc e o bundle sem publicar (não precisa de credencial).
      - name: Valida bundle e configuração do Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dist
